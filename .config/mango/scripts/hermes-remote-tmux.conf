# UTF-8 clients and terminal passthrough for remote Hermes TUI sessions.
set -g allow-passthrough on

# Bidirectional clipboard integration through OSC 52.
set -s set-clipboard on
set -gu terminal-features
set -g terminal-features[100] '*:clipboard:RGB:ccolour:cstyle'
set -g terminal-features[101] 'xterm-kitty:clipboard:RGB:ccolour:cstyle'
set -g terminal-features[102] 'xterm*:clipboard:RGB:ccolour:cstyle'

# Keep mouse selection and tmux copy mode available.
set -g mouse on
