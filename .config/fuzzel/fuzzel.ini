# Fuzzel configuration aligned with DankMaterialShell (DMS) & Material 3
# Colors dynamically generated via Matugen

font=Adwaita Sans:size=11
icon-theme=Papirus-Dark-DankFolders
icons-enabled=yes
prompt="󰍉  "
terminal=kitty -e
layer=overlay
lines=10
width=36
horizontal-pad=22
vertical-pad=14
inner-pad=8
line-height=24
image-size-ratio=0.5
match-mode=fzf
show-actions=yes
exit-on-keyboard-focus-loss=yes

# Matugen dynamic theme
include=~/.config/fuzzel/colors.ini

[border]
width=2
radius=14
selection-radius=8

[dmenu]
mode=text
exit-immediately-if-empty=no
