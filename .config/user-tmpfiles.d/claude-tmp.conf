# Purga subdirectorios temporales de Claude Code sin acceso en más de 3 días (evita inflar /tmp en RAM)
e /tmp/claude-%U/* - - - 3d

# Mantiene el espejo de Formación Integral en disco (/var/tmp/fi-cadena) y su enlace de compatibilidad en /tmp
d /var/tmp/fi-cadena 0755 - - -
L /tmp/fi-cadena - - - - /var/tmp/fi-cadena
