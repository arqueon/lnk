bind=SUPER+ALT,x,reload_config

# Scroller: equivalencias de tamaño y columnas de Niri.
# R y +/- recorren los presets; Shift+/- ajusta la altura en pasos de 50 px.
bind=SUPER,minus,switch_proportion_preset,prev
bind=SUPER,equal,switch_proportion_preset,next
bind=SUPER+SHIFT,minus,resizewin,0,-50
bind=SUPER+SHIFT,equal,resizewin,0,+50
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,i,scroller_stack,left
bind=SUPER,o,scroller_stack,right
bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,period,scroller_stack,right
