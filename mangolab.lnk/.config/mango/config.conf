# MangoWM 0.16.2 — laboratorio aislado de mangolab
# Referencia: https://mangowm.github.io/docs/

# Efectos compatibles con Noctalia (las superficies layer-shell no se difuminan).
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.15

shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=2
shadowscolor=0x00000066

border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.96

# Animaciones sobrias, próximas a la sensación del perfil Niri.
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.6
zoom_end_ratio=0.9
fadein_begin_opacity=0.6
fadeout_begin_opacity=0.85
animation_duration_move=250
animation_duration_open=220
animation_duration_tag=260
animation_duration_close=220
animation_duration_focus=120
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller: el punto de comparación principal con las columnas de Niri.
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.25,0.33333,0.5,0.66667,0.75,1.0

# Master/stack y dwindle.
new_is_master=1
default_mfact=0.55
default_nmaster=1
tag_num=9
smartgaps=0
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=0

# Overview equivalente al flujo Super+E de Niri.
hotarea_size=10
enable_hotarea=0
ov_tab_mode=1
overviewgappi=5
overviewgappo=30

# Foco, cursor y ventanas.
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=0
focus_cross_monitor=1
focus_cross_tag=0
enable_floating_snap=1
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# Teclado equivalente al perfil Niri actual.
repeat_rate=25
repeat_delay=300
numlockon=1
xkb_rules_layout=us
xkb_rules_variant=intl
xkb_rules_options=ctrl:nocaps,altwin:menu_win

# Ratón y trackpad.
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_accel_speed=0.35
swipe_min_threshold=1
mouse_natural_scrolling=0

# Apariencia.
gappih=8
gappiv=8
gappoh=15
gappov=15
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=3
rootcolor=0x15130fff
bordercolor=0x4d4a43ff
dropcolor=0x74804f88
splitcolor=0xac4426ff
focuscolor=0xb75a3cff
maximizescreencolor=0x74804fff
urgentcolor=0xb3261eff
scratchpadcolor=0x3f5f78ff
globalcolor=0x7b5d83ff
overlaycolor=0x3b756fff

# Misma topología física que el perfil Niri de casa-cachyos.
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1,vrr:0,rr:0
monitorrule=name:^DP-2$,width:3440,height:1440,refresh:165,x:1920,y:0,scale:1.21484375,vrr:0,rr:0

# Los nueve tags arrancan con muestras distintas; Super+Alt+N recorre los 14.
circle_layout=tile,scroller,monocle,grid,deck,center_tile,vertical_tile,right_tile,vertical_scroller,vertical_grid,vertical_deck,dwindle,fair,vertical_fair
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:grid
tagrule=id:4,layout_name:deck
tagrule=id:5,layout_name:monocle
tagrule=id:6,layout_name:center_tile
tagrule=id:7,layout_name:vertical_scroller
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:fair

# Entorno de la sesión aislada.
env=PATH,/home/mangolab/.local/bin:/usr/local/bin:/usr/bin
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=XDG_SESSION_TYPE,wayland
env=QT_QPA_PLATFORM,wayland
env=GDK_BACKEND,wayland,x11
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto
exec-once=/home/mangolab/.config/mango/autostart.sh

# Shell: equivalencias principales de Niri + DMS.
# Category: Shell y aplicaciones
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,m,spawn,noctalia msg panel-toggle control-center system
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER,l,spawn,noctalia msg session lock
# Rescate DPMS: fuerza el encendido de ambas salidas sin cambiar de TTY.
bind=SUPER+CTRL+SHIFT,o,spawn,wlopm --on DP-2; wlopm --on HDMI-A-1
bind=SUPER+SHIFT,code:53,spawn,noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet #"Atajos de teclado (Super+Shift+/)"
bind=SUPER+ALT,c,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,n,spawn,noctalia msg panel-toggle control-center notifications

# Lanzadores y utilidades presentes en el perfil Niri efectivo de ruben.
bind=SUPER,b,spawn,bitwarden-desktop
bind=SUPER,d,spawn,dmail show
bind=SUPER+CTRL,n,spawn,newsflash
bind=SUPER+CTRL,s,spawn,/home/mangolab/.config/mango/scripts/launch-homelab-menu.sh sinope
bind=SUPER+CTRL,b,spawn,/home/mangolab/.config/mango/scripts/launch-homelab-menu.sh nas-btb
bind=CTRL+ALT,p,spawn,pamac-manager
bind=SUPER+SHIFT,Return,spawn,dolphin /home/mangolab/Downloads
bind=SUPER+ALT,Return,spawn,thunar /home/mangolab/Downloads
bind=SUPER,Escape,spawn,kitty btop
bind=SUPER+ALT,m,spawn_shell,/home/ruben/.config/niri/scripts/run_chrome.sh --app=https://aurral.arqueonautis.org/ & /opt/Aonsoku/aonsoku &
bind=SUPER+ALT,b,spawn,kitty btop
bind=SUPER+ALT,s,spawn,systemctl suspend
bind=SUPER+SHIFT,m,spawn,wl-present mirror
bind=SUPER+ALT,r,spawn,bash /home/ruben/.config/niri/scripts/gpu_recorder.sh
bind=SUPER+ALT,1,spawn,/home/ruben/.bin/lnk_pull.sh
bind=SUPER+ALT,2,spawn,/home/ruben/.bin/lnk_push.sh
bind=SUPER+ALT,3,spawn,/home/ruben/.bin/lnk_pull_force.sh
bind=SUPER+ALT,v,spawn_shell,blueman-manager & pwvucontrol
bind=SUPER+ALT,p,spawn,/home/ruben/.config/niri/scripts/conectar_audio.sh poseidon
bind=SUPER+ALT,e,spawn,/home/ruben/.config/niri/scripts/conectar_audio.sh earfun
bind=ALT,F10,spawn,noctalia msg volume-mute
bind=ALT,F11,spawn,noctalia msg volume-down 3
bind=ALT,F12,spawn,noctalia msg volume-up 3
bind=SUPER+SHIFT,p,spawn,noctalia msg dpms-off

# Fondos: mismos atajos de Variety que el perfil Niri de ruben.
# Category: Fondos de pantalla
bind=SUPER+ALT,f,spawn_shell,variety --favorite && notify-send 'Variety favorites' 'Copied to Favorites'
bind=SUPER+ALT,w,spawn_shell,variety --next && notify-send 'Next wallpaper'

# Visor de cámaras/webcam equivalente al perfil Niri.
bind=SUPER+CTRL,m,spawn_shell,/home/ruben/.config/niri/scripts/run_chrome.sh --app='https://videostream.arqueonautis.org/stream.html?src=webcam&mode=mse'

# Lanzadores F1-F12 equivalentes al perfil Niri de casa.
# Category: Aplicaciones F1-F12
bind=SUPER,F1,spawn,/home/ruben/.config/niri/scripts/run_chrome.sh
bind=SUPER,F2,spawn,ferdium
bind=SUPER,F3,spawn,zotero
bind=SUPER,F4,spawn,env PATH=/home/ruben/.local/bin:/home/mangolab/.local/bin:/usr/local/bin:/usr/bin /home/ruben/.local/bin/logseq-multi-launch
bind=SUPER,F5,spawn,zettlr
bind=SUPER,F6,spawn,krusader
bind=SUPER,F7,spawn,env GDK_BACKEND=x11 virt-manager --connect qemu:///system --show-domain-console win11
bind=SUPER,F8,spawn,/home/ruben/.config/niri/scripts/run_chrome.sh --app=http://localhost:8080
bind=SUPER,F9,spawn,jdownloader
bind=SUPER,F10,spawn,/home/ruben/.local/bin/Anytype-0.55.5.AppImage
bind=SUPER,F11,spawn,/home/ruben/.config/niri/scripts/run_chrome.sh --app=https://ha.arqueonautis.org/casa-vistosa/principal
bind=SUPER,F12,spawn,flatpak run tech.dongdongbh.mindwtr

# Variantes Alt/Shift que existen en el perfil Niri actual.
# No hay variantes Super+Ctrl+F1-F12 definidas en Niri.
bind=SUPER+ALT,F1,spawn,firefox
bind=SUPER+ALT,F2,spawn,dcal
bind=SUPER+SHIFT,F3,spawn,curl -s http://127.0.0.1:23119/tagnavigator/open
bind=SUPER+ALT,F3,spawn,/home/ruben/.config/niri/scripts/restart-ferdium.sh
bind=SUPER+ALT,F4,spawn_shell,for app in /home/ruben/.local/bin/Tine_*.AppImage; do [ -x "$app" ] && exec "$app"; done; notify-send -u critical Tine "No se encontró Tine"
bind=SUPER+ALT,F5,spawn,/home/ruben/.sdocs/bin/sdoc library
bind=SUPER+ALT,F8,spawn,/home/ruben/.config/niri/scripts/run_chrome.sh --app=https://qbittorrent.arqueonautis.org
bind=SUPER+ALT,F9,spawn_shell,for url in https://droppedneedle.arqueonautis.org/ https://aurral.arqueonautis.org https://sabnzbd.arqueonautis.org https://lidarr.arqueonautis.org http://localhost:8080 https://qbittorrent.arqueonautis.org https://sinope.tailf70cf8.ts.net:5031/downloads; do /home/ruben/.config/niri/scripts/run_chrome.sh --app="$url" & sleep 0.2; done; /opt/Aonsoku/aonsoku &
bind=SUPER+ALT,F10,spawn,claude-desktop
bind=SUPER+SHIFT,F10,spawn,/home/mangolab/.config/mango/scripts/launch-hermes.sh
bind=SUPER+ALT,F11,spawn,antigravity-ide
bind=SUPER+ALT,F12,spawn,noctalia msg panel-toggle launcher /emo

