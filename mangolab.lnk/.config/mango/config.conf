# Captura, audio, brillo y multimedia gestionados por Noctalia.
# Category: Captura y multimedia
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=SHIFT,Print,spawn,noctalia msg screenshot-fullscreen
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen all
bind=ALT,Print,spawn,noctalia msg screenshot-fullscreen pick
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 5
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down 5
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute-toggle
bind=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute-toggle
